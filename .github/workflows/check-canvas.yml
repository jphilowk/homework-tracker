name: Check Canvas connection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-connection-check
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run tests without credentials
        run: npm test
      - name: Check Canvas without exposing student data
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: node scripts/check-canvas.mjs
